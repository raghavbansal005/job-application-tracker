<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTrack | Job Application Tracker</title>
    <meta name="description" content="JobTrack helps job seekers organize applications, interviews and follow-ups in one private workspace." />
    <meta name="theme-color" content="#4f46e5" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JobTrack | Job Application Tracker" />
    <meta property="og:description" content="Organize applications, interviews and follow-ups in one private workspace." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("jobtrack-theme")
          var dark = saved === "dark" || ((saved === "system" || !saved) && window.matchMedia("(prefers-color-scheme: dark)").matches);          
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch (e) { }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
